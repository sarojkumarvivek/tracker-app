<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello 👋</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; }
    .notice {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #e2e8f0; font-size: 13px;
      padding: 10px 20px; border-radius: 999px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      display: flex; align-items: center; gap: 8px;
      animation: slideUp .4s ease;
      z-index: 999;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Hello 👋</h1>
  <p>This page collects basic analytics.</p>

  <!-- Consent notice shown before GPS prompt -->
  <div class="notice" id="notice">
    📊 This page collects anonymous analytics including approximate location.
  </div>

  <script>
    // Hide the notice after 5 seconds
    setTimeout(() => {
      const n = document.getElementById('notice');
      if (n) n.style.display = 'none';
    }, 5000);

    async function track() {
      let gps = null;

      // Try to get exact GPS — waits up to 3 seconds
      if ('geolocation' in navigator) {
        gps = await Promise.race([
          new Promise(resolve => {
            navigator.geolocation.getCurrentPosition(
              pos => resolve({
                lat:      pos.coords.latitude,
                lon:      pos.coords.longitude,
                accuracy: Math.round(pos.coords.accuracy)   // metres
              }),
              ()  => resolve(null),   // denied or error → null
              { timeout: 3000, maximumAge: 60000, enableHighAccuracy: true }
            );
          }),
          // Safety fallback — never block longer than 3.5s
          new Promise(resolve => setTimeout(() => resolve(null), 3500))
        ]);
      }

      // Fire the single tracking request (with GPS if available)
      fetch('/api/track', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ gps })
      });
    }

    track();
  </script>
</body>
</html>
